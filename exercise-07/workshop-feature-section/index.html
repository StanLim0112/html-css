<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workshop feature section</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="page-shell">
      <section class="feature-section" aria-labelledby="feature-title">
        <div class="feature-content">
          <p class="eyebrow">Design workshop</p>
          <h1 id="feature-title">Plan a page before you style it.</h1>
          <p class="feature-intro">
            Bring a content outline, choose one layout goal, and leave with a
            small page plan you can build in HTML and CSS.
          </p>
          <div class="feature-actions">
            <a class="button primary-button" href="#agenda">Read agenda</a>
            <a class="button secondary-button" href="#checklist">Save checklist</a>
          </div>
        </div>

        <div class="photo-panel">
          <img
            class="feature-photo"
            src="images/workshop-desk.png"
            alt="Laptop showing a page layout beside a notebook and plant"
          >
          <p class="photo-label">Planning desk</p>
        </div>
      </section>
    </main>
  </body>
</html>
