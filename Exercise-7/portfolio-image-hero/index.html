<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio image hero exercise</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="page-shell">
      <section class="hero" aria-labelledby="hero-title">
        <div class="hero-content">
          <p class="eyebrow">Portfolio update</p>
          <h1 id="hero-title">Turn a project idea into a clear web page.</h1>
          <p class="hero-intro">
            Use image paths, background images, and positioning to create a
            focused introduction section for a portfolio page.
          </p>
          <div class="hero-actions">
            <a class="button primary-button" href="#projects">View projects</a>
            <a class="button secondary-button" href="#contact">Start a chat</a>
          </div>
        </div>

        <div class="image-panel">
          <!-- Add the content image here. Use images/portfolio-desk.png. -->
           <img
            class="feature-photo"
            src="images/portfolio-desk.png"
            alt="Laptop showing a page layout beside a notebook and plant"
          >
          <p class="image-label">Image section</p>
        </div>
      </section>
    </main>
  </body>
</html>
